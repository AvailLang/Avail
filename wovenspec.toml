# wovenspec.toml — configuration for `Avail`.
#
# This project ingests a document so an agent can retrieve the passage
# that answers a question, instead of reading the whole thing into
# context. It governs no code, so it declares none: there is no crate
# here, no build script, and nothing to annotate.
#
# That is a complete use of wovenspec, not a partial setup. Run
# `wovenspec --help` for the full command surface.

[project]
# Display name and database namespace for this project.
name        = "Avail"
# Leading segment of every MCP tool name this project's server
# exposes (`avail_<verb>`) and the suffix of the MCP
# server name (`wovenspec-avail`). Must be a lowercase
# identifier (`[a-z][a-z0-9_]*`).
tool_prefix = "avail"
description = "Documents made retrievable by wovenspec."

# The coordinate schema declares how a section is addressed. A single
# `section` key means a passage is cited as `3.2`, which is what the
# `spec_lookup` tool takes and what `spec_subsections` returns.
[coordinate]
# The last key is the hierarchy key: its value is a dotted path of
# arbitrary depth, so `3.1.2` is ingested as a child of `3.1`, itself
# a child of `3` — one key addresses the whole tree with nothing to
# declare, and an outline call returns a tree rather than a flat
# list. Any keys before it name the governed document; their values
# never nest.
# Derived by `wovenspec init --docs`: the schema is the intersection of
# what the detected adapters can fill, per source:
#
#   avail/doc/Optimization/Focus_Filter_Design_Summary.md (markdown): fills the single dotted key only
#   avail/doc/Optimization/Level_Two/Post_phi_data.md (markdown): fills the single dotted key only
#   avail/doc/Optimization/Level_Two/Value_manifest.md (markdown): fills the single dotted key only
#   avail/doc/Optimization/Level_Two/Variable_elision.md (markdown): fills the single dotted key only
#   avail/doc/extensions/Module Resolution.md (markdown): fills the single dotted key only
#   avail/doc/modules/PumpedSerialization.md (markdown): fills the single dotted key only
#   avail/doc/packaging/packaging.md (markdown): fills the single dotted key only
#   avail/doc/repository/RepositoryLayout.md (markdown): fills the single dotted key only
#   avail/doc/scripts/Code maintenance scripts.md (markdown): fills the single dotted key only
#
# The single dotted key is the shape every adapter fills, so mixing
# these formats pins the schema there. A project using only adapters
# that fill identity keys would have more room.
keys = ["section"]

# No `default_spec_id` and no `[coordinate.default_version]`: both
# exist to resolve and version the spec ids that *code annotations*
# cite, and this project has no annotations.

# Which parser reads your document. This binary ships these adapters,
# each selected by `adapter = "<name>"`:
#
#   `asciidoc`, `html`, `markdown`, `rfc`, `w3c`
#
# `markdown` reads Markdown, `rfc` reads IETF plaintext, `w3c` and
# `html` read HTML corpora (`w3c` for the semantic `<section>` shape,
# `html` for selector-configured documents), and `asciidoc` reads
# AsciiDoc.

# No document was named, so this setting describes the
# commented `[[spec_source]]` example below: a document that
# numbers its headings.
#
# `number_prefix` takes each section's coordinate from the numeric
# prefix in its heading text — `## 3.2  Transport` becomes section
# `3.2` — so the single `[coordinate]` key carries the document's
# own numbering as a dotted path. Switch to
# `mode = "heading_text"` for a document whose headings carry no
# numbers; the schema stays the same single key either way.
[adapter.markdown]
mode = "number_prefix"
heading_regex = '^(\d+(?:\.\d+)*)\.?\s+(.+)$'

# Point wovenspec at your document by uncommenting this and setting
# `path`, then run `wovenspec ingest --all`. Scaffolding with
# `--spec-source <path>` writes this block for you, with the adapter
# chosen from the file's extension.
#
# [[spec_source]]
# spec_id    = "Avail-spec"
# version_id = "v1"
# adapter    = "markdown"
# path       = "docs/guide.md"

# Repeat `[[spec_source]]` for each further document. Give each its own
# `spec_id`, and the retrieval tools can then be scoped to one of them
# or left to search across all.

# The embedding model search ranks by. Left unset, it is the starter,
# `bge-small-en-v1.5`, which `wovenspec new` declared in
# `.wovenspec/model.toml`; `wovenspec model fetch` puts it on this
# machine, once. Nothing waits for it: an ingest run before the fetch
# stores every row without its vector and exits 0, and the next
# `wovenspec ingest --all` after it fills them.
#
# A project that wants no search, and so no model, says so and deletes
# `.wovenspec/model.toml`. Exact lookups, the bridge and the editor's
# language server need no model; search is not served.
#
# [embedding]
# model = "none"

# Detected by `init --docs`: 30 headings, nesting 2 deep, unnumbered.
[[spec_source]]
spec_id    = "focus-filter-design-summary"
version_id = "v1"
adapter    = "markdown"
path       = "avail/doc/Optimization/Focus_Filter_Design_Summary.md"
# Markdown sources in this project disagree on arrangement, so
# each carries its own; this one was read from the document.
[spec_source.adapter_config]
mode = "heading_text"

[[spec_source]]
spec_id    = "post-phi-data"
version_id = "v1"
adapter    = "markdown"
path       = "avail/doc/Optimization/Level_Two/Post_phi_data.md"
# Markdown sources in this project disagree on arrangement, so
# each carries its own; this one was read from the document.
[spec_source.adapter_config]
mode = "heading_text"

